<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="normal">
<title>FOKUS Player</title>
<style>
  :root { --green: #075033; --mint: #2FFB95; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
               font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }

  /* Das Video ist komplett unsichtbar: außerhalb des Bildes UND vollständig beschnitten.
     Es wird nur der Ton genutzt. */
  #yt {
    position: fixed; left: -400px; top: -400px; width: 200px; height: 200px;
    clip-path: inset(100%); opacity: 0; pointer-events: none; overflow: hidden;
  }

  .wrap {
    height: 100%; display: flex; align-items: center; gap: clamp(10px, 4vw, 16px);
    padding: 0 2px; min-width: 0;
  }

  /* Play / Pause: quadratisch, flach (Design-Kit) */
  #btn {
    flex: none; width: clamp(44px, 14vw, 56px); aspect-ratio: 1;
    border: 0; border-radius: 0; background: var(--mint); color: var(--green);
    display: grid; place-items: center; cursor: pointer; padding: 0;
    transition: background .15s, transform .1s;
  }
  #btn:hover:not(:disabled) { background: #fff; }
  #btn:active:not(:disabled) { transform: scale(0.96); }
  #btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #btn:disabled { opacity: .35; cursor: default; }
  #btn svg { width: 44%; height: 44%; fill: currentColor; }
  #btn .pause { display: none; }
  #btn.playing .play  { display: none; }
  #btn.playing .pause { display: block; }

  /* Equalizer aus schrägen Streifen – angelehnt an das Streifenmuster */
  .eq { flex: none; display: flex; align-items: flex-end; gap: 4px; height: 28px; }
  .eq i {
    display: block; width: 5px; height: 100%; background: linear-gradient(180deg, var(--mint), #1a9a62);
    transform: skewX(-14deg) scaleY(0.18); transform-origin: bottom; transition: transform .3s;
  }
  .playing-state .eq i { animation: eq 1s ease-in-out infinite; }
  .playing-state .eq i:nth-child(2) { animation-duration: 0.8s; animation-delay: -.2s; }
  .playing-state .eq i:nth-child(3) { animation-duration: 1.2s; animation-delay: -.5s; }
  .playing-state .eq i:nth-child(4) { animation-duration: 0.9s; animation-delay: -.1s; }
  .playing-state .eq i:nth-child(5) { animation-duration: 1.1s; animation-delay: -.7s; }
  @keyframes eq { 0%,100% { transform: skewX(-14deg) scaleY(0.2); } 50% { transform: skewX(-14deg) scaleY(1); } }

  #status {
    min-width: 0; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    color: rgba(255,255,255,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #status.err { color: #ffb3b3; text-transform: none; letter-spacing: 0; white-space: normal; font-weight: 400; line-height: 1.3; }

  /* Direkt im Browser geöffnet (nicht in der App eingebettet): dunkler Hintergrund,
     damit Button und weiße Schrift sichtbar sind */
  body.standalone { background: var(--green); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; }
  body.standalone .wrap { height: auto; }
  #ver { display: none; font-size: 11px; letter-spacing: 1px; color: rgba(255,255,255,0.55); text-transform: uppercase; text-align: center; line-height: 1.6; }
  body.standalone #ver { display: block; }

  @media (max-width: 230px) { .eq { display: none; } }
  @media (prefers-reduced-motion: reduce) { .playing-state .eq i { animation: none; transform: skewX(-14deg) scaleY(0.6); } }
</style>
</head>
<body>
<div id="yt"><div id="player"></div></div>

<div class="wrap" id="wrap">
  <button id="btn" aria-label="Play / Pause" disabled>
    <svg class="play"  viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
    <svg class="pause" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/></svg>
  </button>
  <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="status">Lädt…</div>
</div>
<div id="ver">FOKUS Player · Version 3<br>Dies ist die Hilfsseite für die App – Musik startet über die FOKUS-App.</div>

<script>
// Hilfsseite für die FOKUS-App. Läuft auf einer echten https-Adresse, damit YouTube
// einen gültigen Referer sieht (sonst Fehler 153).
// Aufruf: …/player.html?autoplay=1   (optional: &list=PLAYLIST_ID)
const q = new URLSearchParams(location.search);
const LIST = (q.get('list') || 'PL2a-uP2bpH9_yP6L58BO8Bhw4fJKgCwM5').replace(/[^\w-]/g, '');
const AUTOPLAY = q.get('autoplay') === '1';

if (window.self === window.top) document.body.classList.add('standalone');
const btn = document.getElementById('btn');
const wrap = document.getElementById('wrap');
const statusEl = document.getElementById('status');
let player = null, started = false;

function setStatus(t, err) { statusEl.textContent = t; statusEl.className = err ? 'err' : ''; }
function setPlaying(on) { btn.classList.toggle('playing', on); wrap.classList.toggle('playing-state', on); }

const ERRORS = {
  2: 'ungültige Playlist', 5: 'Player-Fehler', 100: 'nicht gefunden',
  101: 'Einbetten gesperrt', 150: 'Einbetten gesperrt',
  153: 'Referer fehlt (Fehler 153)'
};

// Zufälliges Video: Länge der Playlist abwarten, zufälligen Index wählen, danach gemischt
function startRandom() {
  if (started) return;
  let tries = 0;
  const poll = setInterval(() => {
    const ids = player.getPlaylist && player.getPlaylist();
    if ((ids && ids.length) || ++tries > 40) {
      clearInterval(poll);
      started = true;
      clearTimeout(window.__wd);
      window.__wd = setTimeout(() => {
        const st = player.getPlayerState();
        if (st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING) {
          setPlaying(false); setStatus('Zum Starten ▶ drücken');
        }
      }, 6000);
      try {
        player.setLoop(true);
        player.setShuffle(true);
        if (ids && ids.length) player.playVideoAt(Math.floor(Math.random() * ids.length));
        else player.playVideo();
      } catch (e) { player.playVideo(); }
    }
  }, 250);
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    width: 200, height: 200,
    playerVars: { listType: 'playlist', list: LIST, playsinline: 1, controls: 0,
                  rel: 0, origin: location.origin },
    events: {
      onReady: () => {
        btn.disabled = false;
        setStatus(AUTOPLAY ? 'Startet…' : 'Bereit');
        if (AUTOPLAY) startRandom();
      },
      onStateChange: e => {
        const S = YT.PlayerState;
        if (e.data === S.PLAYING)   { setPlaying(true);  setStatus('Läuft'); }
        if (e.data === S.PAUSED)    { setPlaying(false); setStatus('Pausiert'); }
        if (e.data === S.BUFFERING) { setStatus('Lädt…'); }
        if (e.data === S.CUED || e.data === S.UNSTARTED) { setPlaying(false); if (!started) setStatus('Bereit'); }
      },
      onError: e => {
        btn.disabled = true; setPlaying(false);
        setStatus('Fehler ' + e.data + ': ' + (ERRORS[e.data] || 'unbekannt'), true);
      }
    }
  });
}

btn.addEventListener('click', () => {
  if (!player) return;
  const st = player.getPlayerState();
  if (st === YT.PlayerState.PLAYING || st === YT.PlayerState.BUFFERING) player.pauseVideo();
  else if (!started) startRandom();
  else player.playVideo();
});

const s = document.createElement('script');
s.src = 'https://www.youtube.com/iframe_api';
s.onerror = () => setStatus('YouTube nicht erreichbar', true);
document.head.appendChild(s);
</script>
</body>
</html>
