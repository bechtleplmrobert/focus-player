<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>FOKUS Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #042b1c; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #err { color: #e8f5ee; font: 13px/1.5 sans-serif; padding: 16px; }
</style>
</head>
<body>
<script>
// Hilfsseite für die FOKUS-App: bettet YouTube von einer echten https-Adresse aus ein,
// damit YouTube einen gültigen Referer sieht (sonst Fehler 153).
// Aufruf:  …/index.html?v=VIDEO_ID&autoplay=1&loop=1
const q = new URLSearchParams(location.search);
const id = (q.get('v') || 'yEPWQNgRtgY').replace(/[^\w-]/g, '');
const p = new URLSearchParams({ playsinline: 1, rel: 0 });
if (q.get('autoplay') !== '0') p.set('autoplay', 1);
if (q.get('loop') !== '0')     { p.set('loop', 1); p.set('playlist', id); }
const f = document.createElement('iframe');
f.src = `https://www.youtube-nocookie.com/embed/${id}?${p}`;
f.title = 'YouTube video player';
f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
f.referrerPolicy = 'strict-origin-when-cross-origin';
f.allowFullscreen = true;
document.body.appendChild(f);
</script>
<noscript><div id="err">Bitte JavaScript aktivieren.</div></noscript>
</body>
</html>
